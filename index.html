<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wpf841 的个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 640px;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.4);
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 2.2rem; margin-bottom: 0.75rem; }
    .bio { font-size: 1.05rem; line-height: 1.8; color: rgba(255, 255, 255, 0.85); margin-bottom: 2rem; }
    .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .links a {
      color: #fff;
      text-decoration: none;
      padding: 0.55rem 1.4rem;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }
    .links a:hover { background: #fff; color: #203a43; }
    footer { margin-top: 2.5rem; font-size: 0.85rem; color: rgba(255, 255, 255, 0.5); }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="https://github.com/wpf841.png" alt="头像">
    <h1>Hi, 我是 wpf841</h1>
    <p class="bio">
      欢迎来到我的个人主页！<br>
      在这里可以介绍自己：我是谁、在做什么、对什么感兴趣。
    </p>
    <nav class="links">
      <a href="https://github.com/wpf841">GitHub</a>
      <a href="mailto:your-email@example.com">邮箱</a>
    </nav>
    <footer>© 2026 wpf841 · Hosted on GitHub Pages</footer>
  </main>
</body>
</html>
